[project]
name = "projectpulse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "httpx",
    "pydantic",
    "python-dotenv",
    "notion-client",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["live: calls the Meta Model API (costs tokens, output varies)"]
addopts = "-m 'not live'"
